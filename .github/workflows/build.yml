name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  publish-firmware:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-thumbkillerkeyboard3-nice_nano-zmk
          path: dist

      - name: Publish UF2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_id }}
          name: Firmware build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Automatically published firmware build.
          files: dist/thumbkillerkeyboard3-nice_nano-zmk.uf2
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
